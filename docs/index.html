<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="api-icon" rel="icon" href="https://img1.pixhost.to/images/5676/597455481_faykal.png" type="image/png">
    <title id="api-title">kall API !!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen pt-11 pb-8">
    <div id="page-loader" class="page-loader bg-white">
        <div class="loader"></div>
    </div>
    <nav class="py-4 px-7 w-full mx-auto fixed top-0 z-20 bg-white border border-gray-300">
        <div class="flex justify-between items-center">
            <p class="text-md font-medium text-gray-700">kall API's</p>
            <a href="https://whatsapp.com/channel/0029Vax4ADpI1rcZh3aveq1e" target="_blank" class="text-gray-700 hover:text-gray-900 transition duration-300">
                <i class="fab fa-whatsapp text-xl"></i>
            </a>
        </div>
    </nav>
    
    <div class="px-7 md:px-5 max-w-3xl mx-auto pb-8 pt-12">
        <div class="flex text-xs mb-6 text-gray-500">
            <a href="/" class="mr-1">Home</a> > Documentation
        </div>
        <div class="flex flex-col items-start justify-start">
            <h1 class="text-[26px] font-semibold bg-blue-200 text-gray-800 py-1 mb-2 rounded">API Documentation</h1>
            <p class="text-xs text-gray-600 mb-4">Explore and test our API endpoints</p>
            <span class="text-xs text-gray-500 mb-1">Base URL:</span>
            <code class="bg-gray-100 text-xs text-gray-700 font-mono">https://api.faykalbotz.my.id</code>
            <div class="flex gap-4 mt-5">
                <a href="https://pay.faykalbotz.my.id" target="_blank" class="text-xs underline text-gray-500 hover:text-gray-800 transition">Donate</a>
                <a href="https://whatsapp.com/channel/0029Vax4ADpI1rcZh3aveq1e" target="_blank" class="text-xs underline text-gray-500 hover:text-gray-800 transition">Update Channel</a>
            </div>
        </div>
    </div>
    
    <div class="px-7 md:px-5 max-w-3xl mx-auto">
        <div class="relative w-full mb-4">
            <input 
                type="text" 
                id="api-search" 
                class="w-full px-4 py-3 text-sm text-gray-700 border border-gray-300 focus:outline-none focus:ring-1 focus:ring-gray-700 focus:border-transparent pl-12 rounded-lg" 
                placeholder="Search API...">
            <i class="fa-solid fa-magnifying-glass text-gray-400 absolute left-5 top-1/2 transform -translate-y-1/2"></i>
        </div>
        
        <div class="tab-content" id="api-content"></div>
    </div>
    
    <div id="api-modal" class="fixed inset-0 z-50 hidden overflow-y-auto overflow-x-hidden flex items-center justify-center p-6 transition-opacity duration-200 ease-out opacity-0">
        <div class="fixed inset-0 bg-black opacity-0 transition-opacity duration-200 ease-out"></div>
        <div class="relative z-10 bg-white shadow-xl w-full max-w-lg mx-auto p-7 my-auto transform scale-95 opacity-0 transition-all duration-200 ease-out rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center">
                    <span id="api-method" class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 mr-2 rounded-md">GET</span>
                    <h3 class="text-xl font-semibold" id="modal-title">API Request</h3>
                </div>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <span class="material-icons">close</span>
                </button>
            </div>
            
            <div class="mb-3">
                <p id="api-description" class="text-xs font-medium text-gray-600 mt-1">Please try the request</p>
            </div>
            
            <div id="params-container" class="mb-4"></div>
            
            <button id="submit-api" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 text-sm transition duration-300 rounded-md">Execute</button>
            
            <div id="response-container" class="mt-4 hidden">
                <div class="flex items-center justify-between mb-3">
                    <h4 class="text-sm font-medium">Response</h4>
                    <div class="flex items-center">
                        <span id="response-status" class="px-2 py-1 text-xs font-medium bg-green-100 text-green-800 mr-2 rounded-md">200</span>
                        <span id="response-time" class="text-xs text-gray-500">200ms</span>
                    </div>
                </div>
                <pre id="response-data" class="bg-gray-50 p-3 text-xs overflow-auto max-h-60 border border-gray-500 rounded-md"></pre>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
